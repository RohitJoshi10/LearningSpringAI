# ===================================================================
# Application Configuration
# ===================================================================
spring.application.name=SpringAICode

# Load environment variables from a local .env file (if present)
spring.config.import=optional:file:.env[.properties]

# ===================================================================
# Database Configuration (PostgreSQL)
# ===================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/springAI
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate SQL logging (useful for debugging during development)
spring.jpa.show-sql=true

# ===================================================================
# Spring AI - OpenAI Configuration
# ===================================================================
# Reads the OpenAI API key loaded from your .env file or system environment variables
spring.ai.openai.api-key=${OPENAI_API_KEY}

# ===================================================================
# Spring AI - Ollama Models Configuration
# ===================================================================
# Default model for text generation / chat completion
spring.ai.ollama.chat.options.model=llama3.2:1b

# Default model for vector embeddings (used with PGVector / Vector Store)
spring.ai.ollama.embedding.options.model=mxbai-embed-large:latest

spring.main.allow-bean-definition-overriding=true

# Enable automatic schema & type initialization
spring.ai.vectorstore.pgvector.initialize-schema=true

# Set the vector dimension to 1024 for mxbai-embed-large
spring.ai.vectorstore.pgvector.dimensions=1024

# REMOVE or comment out these lines if they are present in application.properties:
# spring.sql.init.schema-location=classpath:init/schema.sql
# spring.sql.init.mode=always