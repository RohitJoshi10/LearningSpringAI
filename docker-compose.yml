services:
  pgvector:
    # Uses PostgreSQL 16 with the official pgvector extension pre-installed
    image: 'pgvector/pgvector:pg16'

    # Environment variables to initialize the database setup
    environment:
      - 'POSTGRES_DB=springAI'
      - 'POSTGRES_PASSWORD=postgres'
      - 'POSTGRES_USER=postgres'

    # Integrates with Spring Boot 3.1+ Testcontainers / Docker Compose support
    # (Automatically injects JDBC properties into your running Spring app)
    labels:
      - "org.springframework.boot.service-connection=postgres"

    # Maps port 5432 on your machine to port 5432 in the container
    ports:
      - '5432:5432'



# Notes:
# 1. To start the container: docker compose up -d
# 2. Verify if it's running and healthy:docker compose ps
# 3. Stop and remove existing container: docker compose down -v
# 4. For redis: docker run -d --name redis-stack -p 6379:6379 -p 8001:8001 redis/redis-stack:latest